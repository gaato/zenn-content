[tools]
node = "26"
"npm:zenn-cli" = "latest"

[tasks.preview]
description = "Zenn のプレビューサーバーを起動"
run = "zenn preview"

[tasks."new:article"]
description = "記事を新規作成 (例: mise run new:article -- --slug my-article)"
run = "zenn new:article"

[tasks."new:book"]
description = "本を新規作成"
run = "zenn new:book"

[tasks.update]
description = "zenn-cli を最新に更新"
run = "mise upgrade npm:zenn-cli"
